repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.11.0
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/johnsoncodehk/deny-binaries
    rev: v1.2.0
    hooks:
      - id: deny-binaries
        args: ["--maxkb=256"]
